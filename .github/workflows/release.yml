name: Build the extension and publish a GitHub Release

# A pushed vX.Y.Z tag builds the extension at that commit and publishes a
# Release on the tag: the zip, named with the version, is attached, and the
# changelog's section for that version is the notes. The tag's version must
# be package.json's, so a tag on the wrong commit fails here instead of
# shipping a mislabelled zip. Tag once, after the release commit is final;
# a moved tag cannot create the release a second time.

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and check the extension zip
        run: npm run zip

      - name: Name the zip by version and take the notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json's version $PACKAGE" >&2
            exit 1
          fi
          cp rental-intel-chrome.zip "rental-intel-chrome-$VERSION.zip"
          node tasks/release-notes.mjs "$VERSION" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "rental-intel-chrome-$VERSION.zip" --title "Rental Intel $VERSION" --notes-file notes.md
