name: Build and publish the documentation and the example site to GitHub Pages

# The docs are the Pages root; the invented rental site (site/) is built for
# its address under them, <pages url>/site/, and copied in beside them. Its
# 404 page becomes the root one, since Pages reads only /404.html: it sends
# an unknown search slug under /site/ to the all-listings page, which is
# what the dev server does (site/src/routes.ts).

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]

  # Allows manual runs from the Actions tab
  workflow_dispatch:

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Generate documentation (README, docs/*.md, TypeDoc API reference)
        run: npm run docs

      - name: Build the example site for its address under the docs
        run: npm run site:build
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.base_url }}/site

      - name: Add the site to the Pages artifact (docs/dist/site, its 404 page at the root)
        run: |
          cp -R site/dist docs/dist/site
          cp site/dist/404.html docs/dist/404.html

      - name: Upload Pages artifact (docs/dist)
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
