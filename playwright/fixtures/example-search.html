<!doctype html>
<!--
  SYNTHETIC fixture: a search-results page on listings.example. It links to
  listings and even carries their JSON-LD inside an ItemList, as real sites
  do, but it is not a listing and must never be saved as one.

  It is also what the Search tab reads: each [data-result] row is one result,
  with its link, price and facts. The listing refusal must keep holding with
  that markup present -- a result row is not a listing marker.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Rentals in Springfield, IL | listings.example</title>
        <link rel="canonical" href="https://listings.example/search/springfield/" />
        <meta property="og:url" content="https://listings.example/search/springfield/" />
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "ItemList",
                "itemListElement": [
                    {
                        "@type": "ListItem",
                        "position": 1,
                        "item": { "@type": "ApartmentComplex", "identifier": "juniper01", "name": "The Juniper Lofts", "url": "https://listings.example/l/juniper01/" }
                    },
                    {
                        "@type": "ListItem",
                        "position": 2,
                        "item": { "@type": "SingleFamilyResidence", "identifier": "pecan00b", "name": "118 Pecan St Unit B", "url": "https://listings.example/l/pecan00b/" }
                    }
                ]
            }
        </script>
    </head>
    <body>
        <main data-search="springfield">
            <h1>Rentals in Springfield, IL</h1>
            <ul>
                <li data-result>
                    <a href="https://listings.example/l/juniper01/">The Juniper Lofts</a>
                    <span data-field="price">$1,895 – $2,850</span>
                    <span data-field="facts">Studio – 2bd · 1 – 2ba</span>
                </li>
                <li data-result>
                    <a href="https://listings.example/l/pecan00b/">118 Pecan St Unit B</a>
                    <span data-field="price">$2,400</span>
                    <span data-field="facts">2bd/1ba · 1,150 sqft</span>
                </li>
            </ul>
        </main>
    </body>
</html>
